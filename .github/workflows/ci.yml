name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile all study code
        run: python -m py_compile src/*.py scripts/*.py
      - name: Results regenerate unchanged from the evidence
        run: |
          sh scripts/fetch_funsd.sh
          python scripts/make_results.py
          git diff --exit-code RESULTS.md results/metrics.json
